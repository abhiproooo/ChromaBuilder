name: Android CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: >-
            platforms;android-36
            build-tools;36.0.0
            ndk;27.0.12077973
            cmake;3.22.1

      - name: Install CMake and Ninja
        shell: bash
        run: |
          set -euo pipefail

          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKM="$(command -v sdkmanager || true)"
          if [ -z "${SDKM}" ] && [ -x "${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKM="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
          fi
          if [ -z "${SDKM}" ]; then
            echo "sdkmanager not found" >&2
            exit 1
          fi

          yes | "${SDKM}" --licenses >/dev/null || true
          "${SDKM}" --install "cmake;3.22.1"

          # Ninja is normally bundled with the Android SDK CMake package. Install a
          # system copy as a fallback and make sure it is available where AGP looks.
          if [ ! -x "${SDK_ROOT}/cmake/3.22.1/bin/ninja" ]; then
            if ! command -v ninja >/dev/null 2>&1; then
              sudo apt-get update
              sudo apt-get install -y ninja-build
            fi
            sudo ln -sf "$(command -v ninja)" "${SDK_ROOT}/cmake/3.22.1/bin/ninja"
          fi

          echo "${SDK_ROOT}/cmake/3.22.1/bin" >> "${GITHUB_PATH}"
          export PATH="${SDK_ROOT}/cmake/3.22.1/bin:${PATH}"

          cmake --version
          ninja --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
